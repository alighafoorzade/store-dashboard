name: Static security analysis

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "29 4 * * 2"
  workflow_dispatch:

concurrency:
  group: sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep high-severity gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container: semgrep/semgrep:1.164.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan TypeScript and React
        run: >-
          semgrep scan --error --severity ERROR --metrics=off
          --config p/typescript --config p/react --config p/owasp-top-ten .

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        with:
          category: /language:javascript-typescript
          output: codeql-results
      - name: Reject high and critical findings
        run: node scripts/check-codeql-severity.mjs codeql-results 7
