name: Dynamic security analysis

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production server
        run: |
          npm run start > /tmp/shop-dashboard.log 2>&1 &
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:3000/
      - name: Run baseline scan
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: http://127.0.0.1:3000/
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report
